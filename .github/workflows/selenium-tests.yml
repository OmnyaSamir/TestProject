name: Selenium TestNG Suite

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:
    inputs:
      browser:
        description: "Target browser (chrome or firefox)"
        required: true
        default: "chrome"
        type: choice
        options:
          - chrome
          - firefox
      useGrid:
        description: "Execute via local Selenium Grid inside runner"
        required: true
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

jobs:
  run-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: "25"
          distribution: "temurin"
          cache: "maven"

      - name: Start Selenium Standalone Grid (when UseGrid=true)
        if: ${{ (github.event.inputs.useGrid == 'true') }}
        run: |
          mkdir -p /tmp/selenium-grid
          curl -sSL -o /tmp/selenium-grid/selenium-server.jar \
            https://github.com/SeleniumHQ/selenium/releases/download/selenium-4.54.0/selenium-server-4.54.0.jar
          xvfb-run -a java -jar /tmp/selenium-grid/selenium-server.jar standalone --selenium-manager true > /tmp/selenium-grid/grid.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -s http://localhost:4444/status | grep -q '"ready": true'; then
              echo "Selenium Grid is ready!"
              break
            fi
            sleep 2
          done

      - name: Run Maven TestNG Suite
        env:
          CI: "true"
        run: |
          BROWSER="${{ inputs.browser || 'chrome' }}"
          USE_GRID="${{ inputs.useGrid || 'false' }}"
          if [ "$USE_GRID" = "true" ]; then
            mvn test -DUseGrid=true -DGridUrl=http://localhost:4444 -DTargetBrowser=$BROWSER
          else
            xvfb-run -a mvn test -DUseGrid=false -DTargetBrowser=$BROWSER
          fi

      - name: Upload Surefire Test Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports/
